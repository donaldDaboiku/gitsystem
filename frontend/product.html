<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product — GITSYSTEM</title>
    <meta name="description" content="View product details, pricing, and request a quote from GITSYSTEM.">
    <meta name="api-base" content="/backend/data.php">
    <meta name="frontend-base" content="/frontend">
    <meta name="gitinvoice-url" content="https://git-invoice-three.vercel.app">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/gitsystem-icon.png" type="image/png">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="product-page">
    <div class="bg-animation">
        <div class="grid-overlay"></div>
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <header id="header">
        <nav>
            <a href="index.html" class="logo" aria-label="GITSYSTEM home">
                <img src="assets/gitsystem-logo.png" alt="GITSYSTEM" class="logo-img" width="200" height="40">
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#products">Products</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
            <div class="mobile-toggle" id="mobileToggle">
                <span></span><span></span><span></span>
            </div>
        </nav>
    </header>

    <main id="productMain">
        <div class="product-loading-screen">
            <div class="loader-ring"></div>
            <p>Loading product…</p>
        </div>
    </main>

    <div class="product-sticky-bar" id="stickyBar" hidden>
        <div class="sticky-bar-inner">
            <div class="sticky-info">
                <span class="sticky-name" id="stickyName"></span>
                <span class="sticky-price" id="stickyPrice"></span>
            </div>
            <div class="sticky-actions">
                <button type="button" class="btn btn-secondary btn-sm" id="stickyContact">Contact Us</button>
                <button type="button" class="btn btn-primary btn-sm" id="stickyBuy">Request Quote</button>
            </div>
        </div>
    </div>

    <footer class="product-footer-mini">
        <p>&copy; <span id="currentYear"></span> GITSYSTEMNG — <a href="index.html">Back to home</a></p>
    </footer>

    <button class="scroll-top" id="scrollTop">↑</button>

    <script src="shared.js?v=5"></script>
    <script src="product.js?v=2"></script>
</body>
</html>
